name: Test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows runs the PowerShell parse and injection checks on every generated
    # script; macOS and Linux run everything that needs no interpreter. (The
    # AppleScript compile checks need Outlook installed, so they skip in CI.)
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
